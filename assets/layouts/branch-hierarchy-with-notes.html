<!-- Fixed side-root hierarchy. Repeat complete branch and note nodes only. The canonical script owns one smooth SVG shaft and one compact attached arrowhead per branch; generation must not hand-author or replace connector geometry. The root contains only the authored governing heading, never a metric owned by a note. No bottom vision/summary band exists in this skeleton. -->
<style data-layout-style="branch-hierarchy-with-notes">
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-body{display:grid;flex:1 1 auto;min-height:0;grid-template-columns:minmax(0,1.7fr) minmax(20cqw,.72fr);gap:2cqw;align-items:stretch;padding:2.1cqh 0 2.2cqh}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-map{position:relative;display:grid;min-width:0;min-height:0;grid-template-columns:minmax(12cqw,.58fr) minmax(0,1.52fr);gap:3.2cqw;align-items:center;padding:1.5cqh 1cqw}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-connectors{position:absolute;inset:0;z-index:0;width:100%;height:100%;overflow:visible;color:var(--accent-1);pointer-events:none}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-connector-path{fill:none;stroke:var(--muted);stroke-width:2px;stroke-linecap:round;stroke-linejoin:round;opacity:.82;vector-effect:non-scaling-stroke}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-connector-arrowhead{fill:var(--muted);opacity:.95}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-root,.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-branches{position:relative;z-index:1}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-root{display:grid;min-height:18cqh;padding:1.5cqh 1.2cqw;place-items:center;border-radius:.55cqw;background:var(--accent-1);color:var(--pill-ink);font-size:clamp(18px,1.55cqw,30px);font-weight:800;line-height:1.18;text-align:center}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-branches{display:grid;align-content:center;gap:1.05cqh}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-branch{display:grid;min-width:0;min-height:10.5cqh;align-content:center;gap:.5cqh;padding:1.15cqh 1.1cqw;border:1px solid var(--panel-line);border-left:.4cqw solid var(--accent-1);border-radius:.5cqw;background:var(--panel-background)}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-branch h2{margin:0;color:var(--ink);font-size:clamp(14px,1.12cqw,21px);line-height:1.15}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-branch p{margin:0;color:var(--muted);font-size:clamp(10px,.78cqw,14px);line-height:1.27}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-notes{display:grid;min-width:0;min-height:0;align-content:stretch;gap:1.15cqh}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-note{display:grid;min-width:0;min-height:0;align-content:center;gap:.6cqh;padding:1.3cqh 1.05cqw;border:1px solid var(--panel-line);border-top:.35cqh solid var(--accent-1);border-radius:.5cqw;background:var(--panel-background)}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-note-title{margin:0;color:var(--ink);font-size:clamp(16px,1.35cqw,26px);line-height:1.17}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-note strong{color:var(--accent-1);font-size:clamp(23px,2.2cqw,42px);line-height:1}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-note-copy,.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-note p,.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-note ul{margin:0;color:var(--muted);font-size:clamp(11px,.86cqw,16px);line-height:1.3}
.slide[data-layout="branch-hierarchy-with-notes"] .branch-hierarchy-note ul{padding-left:1.05cqw}
</style>
<section id="{{SLIDE_ID}}" class="slide" data-layout="branch-hierarchy-with-notes" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header compact slide-section" data-pptx-shape><div><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p></div></header>
  <section class="branch-hierarchy-body" data-geometry-fill-body><div class="branch-hierarchy-map" data-pptx-shape><svg class="branch-hierarchy-connectors" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg><div class="branch-hierarchy-root" data-pptx-shape>{{ROOT}}</div><div class="branch-hierarchy-branches" data-layout-repeat="hierarchy-branches" data-layout-count="{{BRANCH_COUNT}}" data-layout-item-tag="article" data-layout-item-class="branch-hierarchy-branch" data-layout-item-roles="branch-hierarchy-branch-title branch-hierarchy-branch-copy">{{BRANCHES}}</div></div><aside class="branch-hierarchy-notes" data-layout-repeat="hierarchy-notes" data-layout-count="{{NOTE_COUNT}}" data-layout-item-tag="article" data-layout-item-class="branch-hierarchy-note" data-layout-item-roles="branch-hierarchy-note-title branch-hierarchy-note-copy">{{NOTES}}</aside></section>
  <script>(()=>{const slide=document.currentScript.closest('.slide');const map=slide.querySelector('.branch-hierarchy-map');const rootNode=slide.querySelector('.branch-hierarchy-root');const svg=slide.querySelector('.branch-hierarchy-connectors');const draw=()=>{const frame=map.getBoundingClientRect();const source=rootNode.getBoundingClientRect();const sx=(source.right-frame.left)/frame.width*100;const sy=(source.top+source.height/2-frame.top)/frame.height*100;svg.replaceChildren();for(const branch of slide.querySelectorAll('.branch-hierarchy-branches > .branch-hierarchy-branch')){const target=branch.getBoundingClientRect();const ex=(target.left-frame.left)/frame.width*100;const ey=(target.top+target.height/2-frame.top)/frame.height*100;const dx=Math.max(1,ex-sx);const c1=sx+dx*.34;const c2=sx+dx*.72;const shaft=document.createElementNS('http://www.w3.org/2000/svg','path');shaft.setAttribute('class','branch-hierarchy-connector-path');shaft.setAttribute('d',`M ${sx} ${sy} C ${c1} ${sy}, ${c2} ${ey}, ${ex} ${ey}`);const head=document.createElementNS('http://www.w3.org/2000/svg','path');const hw=6/frame.width*100;const hh=2.8/frame.height*100;head.setAttribute('class','branch-hierarchy-connector-arrowhead');head.setAttribute('d',`M ${ex} ${ey} L ${ex-hw} ${ey-hh} L ${ex-hw} ${ey+hh} Z`);svg.append(shaft,head)}};requestAnimationFrame(draw);window.addEventListener('resize',draw,{passive:true})})()</script>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
