<style data-layout-style="card-flow-target-band">
    .slide[data-layout="card-flow-target-band"] .canvas { display:block; padding:4cqh 3cqw 3.3cqh; }
    .slide[data-layout="card-flow-target-band"] .slide-header { display:block; height:auto; border-bottom:0; }
    .slide[data-layout="card-flow-target-band"] .title { margin:0 0 3.3cqh; font-size:clamp(34px,2.56cqw,49px); line-height:1.1; font-weight:800; letter-spacing:0; }
    .slide[data-layout="card-flow-target-band"] .title::before { display:inline-block; width:.38cqw; height:3.35cqh; margin-right:1.06cqw; background:var(--accent-1); vertical-align:-.22cqh; box-shadow:.38cqw 1.33cqh 0 -.06cqw var(--negative); content:""; }
    .slide[data-layout="card-flow-target-band"] .panel { border:1px solid var(--panel-line); border-radius:.38cqw; background:var(--panel-background); }
    .slide[data-layout="card-flow-target-band"] .response-flow { display:grid; grid-template-columns:1fr 1.25fr 1fr 1fr; align-items:center; gap:3.25cqw; margin:10.2cqh 1.56cqw 0; }
    .slide[data-layout="card-flow-target-band"] .response-connectors { position:absolute; inset:0; z-index:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
    .slide[data-layout="card-flow-target-band"] .response-connector-path { fill:none; stroke:var(--muted); stroke-width:2px; stroke-linecap:round; vector-effect:non-scaling-stroke; }
    .slide[data-layout="card-flow-target-band"] .response-connector-arrowhead { fill:var(--muted); stroke:none; }
    .slide[data-layout="card-flow-target-band"] .response-card { position:relative; z-index:1; height:43.35cqh; padding:4cqh 1.88cqw; text-align:center; }
    .slide[data-layout="card-flow-target-band"] .response-card.core { height:56.1cqh; padding:2.67cqh 1.88cqw; border:2px solid var(--negative); box-shadow:0 0 20px color-mix(in srgb,var(--negative) 18%,transparent); }
    .slide[data-layout="card-flow-target-band"] .badge { display:inline-block; padding:1cqh 1.13cqw; border-radius:.44cqw; background:var(--panel-2); color:var(--accent-1); font-weight:800; font-size:clamp(13px,1cqw,19px); }
    .slide[data-layout="card-flow-target-band"] .core .badge { border-radius:2.2cqh; background:var(--negative); color:var(--ink); }
    .slide[data-layout="card-flow-target-band"] .icon { display:grid; width:4.5cqw; height:8cqh; margin:2.2cqh auto; place-items:center; border-radius:50%; background:var(--panel-2); color:var(--accent-1); font-size:clamp(28px,2.13cqw,41px); }
    .slide[data-layout="card-flow-target-band"] .core .icon { background:color-mix(in srgb,var(--negative) 18%,var(--panel-2)); color:var(--negative); }
    .slide[data-layout="card-flow-target-band"] .response-card h2 { margin:0 0 1.2cqh; font-size:clamp(21px,1.56cqw,30px); line-height:1.2; }
    .slide[data-layout="card-flow-target-band"] .core h2 { color:var(--negative); }
    .slide[data-layout="card-flow-target-band"] .response-card p { margin:.9cqh 0; color:var(--muted); font-size:clamp(13px,1cqw,19px); line-height:1.45; }
    .slide[data-layout="card-flow-target-band"] .response-card.core p { font-size:clamp(12px,.94cqw,18px); line-height:1.32; }
    .slide[data-layout="card-flow-target-band"] .sla { display:grid; gap:.67cqh; margin:1.35cqh 0; }
    .slide[data-layout="card-flow-target-band"] .sla span { display:flex; justify-content:space-between; padding:1.1cqh 1.13cqw; border:1px solid color-mix(in srgb,var(--negative) 45%,var(--panel-line)); border-radius:.19cqw; background:color-mix(in srgb,var(--negative) 18%,var(--panel-2));  font-size:clamp(12px,.88cqw,17px); }
    .slide[data-layout="card-flow-target-band"] .red { color:var(--negative); }
    .slide[data-layout="card-flow-target-band"] .response-bottom { position:absolute; right:3cqw; bottom:5.55cqh; left:3cqw; display:grid; height:15cqh; grid-template-columns:21.9cqw 1fr; align-items:center; gap:2.5cqw; padding:3.1cqh 3.38cqw; border-left:.38cqw solid var(--accent-1); background:var(--panel-background); }
    .slide[data-layout="card-flow-target-band"] .mttr small { display:block; color:var(--muted); font-size:clamp(14px,1.06cqw,20px); }
    .slide[data-layout="card-flow-target-band"] .mttr strong { color:var(--positive); font-size:clamp(32px,2.38cqw,46px); }
    .slide[data-layout="card-flow-target-band"] .mttr del { color:var(--negative); }
    .slide[data-layout="card-flow-target-band"] .response-bottom p { margin:0; color:var(--ink); font-size:clamp(15px,1.13cqw,22px); line-height:1.7; }
    .slide[data-layout="card-flow-target-band"] .response-bottom b { color:var(--accent-1); }
    .slide[data-layout="card-flow-target-band"] .deck-foot { position:absolute; right:3cqw; bottom:1.1cqh; left:3cqw; min-height:0; color:var(--muted); }
</style>
<!-- Fixed skeleton: four emergency-response stages in a source-authored horizontal flow, exactly one featured card may own a three-item SLA stack, followed by one MTTR/core-target band. The canonical script owns one horizontal shaft and one compact attached arrowhead between every adjacent stage; generation must not omit, replace, or hand-author these connectors. Repeat only response cards and SLA items. -->
<section id="{{SLIDE_ID}}" class="slide" data-layout="card-flow-target-band" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header compact slide-section" data-pptx-shape><h1 class="title">{{TITLE}}</h1></header>
  <svg class="response-connectors" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
  <div class="response-flow" data-layout-repeat="response-cards" data-layout-count="{{CARD_COUNT}}" data-layout-item-tag="article" data-layout-item-class="response-card" data-layout-item-roles="badge icon response-title response-copy">{{CARDS}}</div>
  <div class="response-bottom" data-pptx-shape data-geometry-contain-content>{{TARGET_BAND}}</div>
  <script>(()=>{const slide=document.currentScript.closest('.slide');const canvas=slide.querySelector('.canvas');const svg=slide.querySelector('.response-connectors');const draw=()=>{const frame=canvas.getBoundingClientRect();const cards=[...slide.querySelectorAll('.response-flow > .response-card')];svg.replaceChildren();for(let i=0;i<cards.length-1;i+=1){const from=cards[i].getBoundingClientRect();const to=cards[i+1].getBoundingClientRect();const sx=(from.right-frame.left)/frame.width*100;const ex=(to.left-frame.left)/frame.width*100;const sy=(from.top+from.height/2-frame.top)/frame.height*100;const ey=(to.top+to.height/2-frame.top)/frame.height*100;const shaft=document.createElementNS('http://www.w3.org/2000/svg','path');shaft.setAttribute('class','response-connector-path');shaft.setAttribute('d',`M ${sx} ${sy} C ${sx+(ex-sx)*.35} ${sy}, ${sx+(ex-sx)*.65} ${ey}, ${ex} ${ey}`);const head=document.createElementNS('http://www.w3.org/2000/svg','path');const hw=10/frame.width*100;const hh=6/frame.height*100;head.setAttribute('class','response-connector-arrowhead');head.setAttribute('d',`M ${ex} ${ey} L ${ex-hw} ${ey-hh} L ${ex-hw} ${ey+hh} Z`);svg.append(shaft,head)}};requestAnimationFrame(draw);window.addEventListener('resize',draw,{passive:true})})()</script>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
