<style data-layout-style="metric-strip-chain-notes">
    .slide[data-layout="metric-strip-chain-notes"] .canvas { display:flex; flex-direction:column; padding:4cqh 3cqw 3.3cqh; }
    .slide[data-layout="metric-strip-chain-notes"] .slide-header { display:block; height:auto; border-bottom:0; }
    .slide[data-layout="metric-strip-chain-notes"] .title { margin:0 0 3.3cqh; font-size:clamp(34px,2.56cqw,49px); line-height:1.1; font-weight:800; letter-spacing:0; }
    .slide[data-layout="metric-strip-chain-notes"] .title::before { display:inline-block; width:.38cqw; height:3.35cqh; margin-right:1.06cqw; background:var(--accent-1); vertical-align:-.22cqh; box-shadow:.38cqw 1.33cqh 0 -.06cqw var(--negative); content:""; }
    .slide[data-layout="metric-strip-chain-notes"] .panel { border:1px solid var(--panel-line); border-radius:.38cqw; background:var(--panel-background); }
    .slide[data-layout="metric-strip-chain-notes"] .db-top { display:grid; grid-template-columns:repeat(var(--metric-count),minmax(0,1fr)); gap:1.5cqw; }
    .slide[data-layout="metric-strip-chain-notes"] .db-metric { min-height:15cqh; padding:2.2cqh 1.75cqw; }
    .slide[data-layout="metric-strip-chain-notes"] .db-metric.danger { border-left:.44cqw solid var(--negative); }
    .slide[data-layout="metric-strip-chain-notes"] .db-metric-title { margin:0 0 .9cqh; color:var(--muted); font-size:clamp(12px,.9cqw,17px); font-weight:500; line-height:1.15; }
    .slide[data-layout="metric-strip-chain-notes"] .db-metric p { margin:1.1cqh 0; color:var(--muted); font-size:clamp(13px,.94cqw,18px); line-height:1.35; }
    .slide[data-layout="metric-strip-chain-notes"] .db-metric strong { display:block; color:var(--accent-1); font-size:clamp(28px,2.13cqw,41px); line-height:1.1; }
    .slide[data-layout="metric-strip-chain-notes"] .db-metric.danger strong,.slide[data-layout="metric-strip-chain-notes"] .db-metric.red strong { color:var(--negative); }
    .slide[data-layout="metric-strip-chain-notes"] .db-metric span { color:var(--muted); font-size:clamp(12px,.88cqw,17px); }
    .slide[data-layout="metric-strip-chain-notes"] .db-main { display:grid; flex:0 0 48cqh; min-height:0; grid-template-columns:1fr 1.35fr; gap:1.56cqw; align-items:stretch; margin:2.5cqh 0 2.2cqh; }
    .slide[data-layout="metric-strip-chain-notes"] .mechanism { display:flex; min-height:0; flex-direction:column; padding:2.6cqh 2.13cqw; }
    .slide[data-layout="metric-strip-chain-notes"] .mechanism h2 { margin:0 0 1.33cqh; font-size:clamp(19px,1.44cqw,28px); line-height:1.15; }
    .slide[data-layout="metric-strip-chain-notes"] .flow-stack { position:relative; flex:1 1 auto; min-height:0; }
    .slide[data-layout="metric-strip-chain-notes"] .flow-steps { position:relative; z-index:1; display:grid; height:100%; grid-template-rows:repeat(var(--flow-count),minmax(5.2cqh,auto)); align-content:space-between; gap:1.4cqh; }
    .slide[data-layout="metric-strip-chain-notes"] .flow-box { width:70%; margin:0 auto; padding:1.33cqh 1cqw; border:1px solid var(--accent-1); border-radius:.38cqw; text-align:center; font-size:clamp(13px,1cqw,19px); line-height:1.25; }
    .slide[data-layout="metric-strip-chain-notes"] .flow-box.bad { border-color:var(--negative); color:var(--negative); }
    .slide[data-layout="metric-strip-chain-notes"] .down { height:2cqh; color:var(--muted); font-size:clamp(17px,1.25cqw,24px); line-height:2cqh; text-align:center; }
    .slide[data-layout="metric-strip-chain-notes"] .flow-connectors { position:absolute; inset:0; z-index:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
    .slide[data-layout="metric-strip-chain-notes"] .flow-connector-path { fill:none; stroke:var(--muted); stroke-width:1.7px; stroke-linecap:round; vector-effect:non-scaling-stroke; }
    .slide[data-layout="metric-strip-chain-notes"] .flow-connector-arrowhead { fill:var(--muted); }
    .slide[data-layout="metric-strip-chain-notes"] .db-notes { display:grid; min-height:0; grid-template-rows:repeat(var(--note-count),minmax(12cqh,1fr)); align-content:stretch; gap:1.5cqh; }
    .slide[data-layout="metric-strip-chain-notes"] .db-note { display:grid; min-width:0; min-height:12cqh; grid-template-columns:3.88cqw minmax(0,1fr); grid-template-rows:auto auto; column-gap:1cqw; align-content:center; padding:2.1cqh 1.45cqw; }
    .slide[data-layout="metric-strip-chain-notes"] .db-note-index { display:grid; width:3.25cqw; height:6.45cqh; grid-row:1 / span 2; place-items:center; align-self:center; border-radius:.44cqw; background:var(--panel-2); color:var(--accent-1); font-size:clamp(20px,1.5cqw,29px); font-weight:800; line-height:1; }
    .slide[data-layout="metric-strip-chain-notes"] .db-note:last-child .db-note-index { background:color-mix(in srgb,var(--negative) 18%,var(--panel-2)); color:var(--negative); }
    .slide[data-layout="metric-strip-chain-notes"] .db-note h2 { min-width:0; margin:0 0 .7cqh; font-size:clamp(19px,1.44cqw,28px); line-height:1.15; }
    .slide[data-layout="metric-strip-chain-notes"] .db-note p { min-width:0; margin:0; color:var(--muted); font-size:clamp(13px,1cqw,19px); line-height:1.38; }
    .slide[data-layout="metric-strip-chain-notes"] .deck-foot { position:absolute; right:3cqw; bottom:1.1cqh; left:3cqw; min-height:0; color:var(--muted); }
</style>
<!-- Fixed skeleton: a repeatable metric status strip over a two-column body containing one vertical mechanism chain and numbered evidence notes. Emit metric, flow-box, and note nodes as direct children that satisfy their declared item contracts. Every metric card uses one p.db-metric-title for the small ordinary label, one strong.db-metric-value for the prominent value, and optional ordinary supporting text; never promote an ordinary source label into h2. The template script owns one explicit shaft and compact arrowhead between adjacent flow boxes; never omit or replace them with glyph text. -->
<section id="{{SLIDE_ID}}" class="slide" data-layout="metric-strip-chain-notes" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header compact slide-section" data-pptx-shape><h1 class="title">{{TITLE}}</h1></header>
  <div class="db-top" data-layout-repeat="db-metrics" data-layout-count="{{METRIC_COUNT}}" data-layout-item-tag="article" data-layout-item-class="db-metric" data-layout-item-roles="db-metric-title db-metric-value db-metric-copy" data-layout-role-tags="db-metric-title:p db-metric-value:strong db-metric-copy:p" data-layout-direct-roles="db-metric-title db-metric-value db-metric-copy" data-layout-allowed-item-classes="panel" style="--metric-count:{{METRIC_COUNT}}">{{METRICS}}</div>
  <div class="db-main"><article class="panel mechanism" data-pptx-shape data-geometry-contain-content><h2>{{MECHANISM_TITLE}}</h2><div class="flow-stack"><svg class="flow-connectors" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg><div class="flow-steps" data-layout-repeat="mechanism-flow-steps" data-layout-count="{{FLOW_COUNT}}" data-layout-item-tag="div" data-layout-item-class="flow-box" data-layout-item-roles="flow-box-label" data-layout-role-tags="flow-box-label:span" data-layout-direct-roles="flow-box-label" data-layout-role-attrs="flow-box-label:data-pptx-text" data-layout-allowed-item-classes="alert" style="--flow-count:{{FLOW_COUNT}}">{{FLOW_NODES}}</div></div></article><div class="db-notes" data-layout-repeat="db-notes" data-layout-count="{{NOTE_COUNT}}" data-layout-item-tag="article" data-layout-item-class="db-note" data-layout-item-roles="db-note-index db-note-title db-note-copy" data-layout-role-tags="db-note-index:span db-note-title:h2 db-note-copy:p" data-layout-direct-roles="db-note-index db-note-title db-note-copy" data-layout-role-attrs="db-note-index:data-pptx-shape,data-pptx-text" data-layout-allowed-item-classes="panel alert" style="--note-count:{{NOTE_COUNT}}">{{NOTES}}</div></div>
  <script>(()=>{const slide=document.currentScript.closest('.slide');const frame=slide.querySelector('.flow-stack');const svg=slide.querySelector('.flow-connectors');const draw=()=>{const box=frame.getBoundingClientRect();const nodes=[...slide.querySelectorAll('.flow-steps > .flow-box')];svg.replaceChildren();for(let i=0;i<nodes.length-1;i+=1){const a=nodes[i].getBoundingClientRect();const b=nodes[i+1].getBoundingClientRect();const x=(a.left+a.width/2-box.left)/box.width*100;const sy=(a.bottom-box.top)/box.height*100;const ey=(b.top-box.top)/box.height*100;const shaft=document.createElementNS('http://www.w3.org/2000/svg','path');shaft.setAttribute('class','flow-connector-path');shaft.setAttribute('d',`M ${x} ${sy} L ${x} ${ey}`);const head=document.createElementNS('http://www.w3.org/2000/svg','path');const hw=3/box.width*100;const hh=4/box.height*100;head.setAttribute('class','flow-connector-arrowhead');head.setAttribute('d',`M ${x} ${ey} L ${x-hw} ${ey-hh} L ${x+hw} ${ey-hh} Z`);svg.append(shaft,head)}};requestAnimationFrame(draw);window.addEventListener('resize',draw,{passive:true})})()</script>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
