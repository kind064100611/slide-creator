<style data-layout-style="metric-grid">
    .slide[data-layout="metric-grid"] .metric-grid-body { display:flex; flex:1 1 auto; min-height:0; flex-direction:column; gap:3.4cqh; padding:2.2cqh 0 1.6cqh; }
    .slide[data-layout="metric-grid"] .metric-grid-lead { display:grid; flex:0 0 20cqh; grid-template-columns:repeat(auto-fit,minmax(24cqw,1fr)); gap:1.5cqh 3.2cqw; align-content:center; padding:3.2cqh 2.9cqw; border:1px solid var(--panel-line); border-left:.48cqw solid var(--accent-1); border-radius:.55cqw; background:var(--panel-background); }
    .slide[data-layout="metric-grid"] .metric-grid-lead h2 { grid-column:1 / -1; margin:0; color:var(--accent-1); font-size:clamp(19px,1.65cqw,32px); line-height:1.14; }
    .slide[data-layout="metric-grid"] .metric-grid-lead p { margin:0; color:var(--muted); font-size:clamp(13px,1.08cqw,21px); line-height:1.34; }
    .slide[data-layout="metric-grid"] .metric-grid-cards { display:grid; min-height:0; gap:1.6cqw; }
    .slide[data-layout="metric-grid"] .metric-grid-cards.primary { flex:0 0 25cqh; grid-template-columns:repeat(auto-fit,minmax(18cqw,1fr)); }
    .slide[data-layout="metric-grid"] .metric-grid-cards.secondary { flex:0 0 27cqh; grid-template-columns:repeat(auto-fit,minmax(14cqw,1fr)); }
    .slide[data-layout="metric-grid"] .metric-card { position:relative; display:flex; min-width:0; min-height:0; flex-direction:column; justify-content:flex-start; gap:1.5cqh; overflow:hidden; padding:3.1cqh 2.2cqw; border:1px solid var(--panel-line); border-top:.42cqh solid var(--accent-1); border-radius:.55cqw; background:var(--panel-background); }
    .slide[data-layout="metric-grid"] .metric-card:nth-child(3n+2) { border-top-color:var(--accent-2); }
    .slide[data-layout="metric-grid"] .metric-card:nth-child(3n) { border-top-color:var(--accent-3); }
    .slide[data-layout="metric-grid"] .metric-card h2 { margin:0; color:var(--ink); font-size:clamp(16px,1.42cqw,27px); line-height:1.16; }
    .slide[data-layout="metric-grid"] .metric-card strong { display:block; color:var(--accent-1); font-size:clamp(28px,2.7cqw,52px); line-height:1; }
    .slide[data-layout="metric-grid"] .metric-card p { margin:0; color:var(--muted); font-size:clamp(12px,1.02cqw,20px); line-height:1.3; }
    .slide[data-layout="metric-grid"] .metric-grid-cards.secondary .metric-card { padding:2.6cqh 1.65cqw; }
    .slide[data-layout="metric-grid"] .metric-grid-cards.secondary .metric-card h2 { font-size:clamp(14px,1.2cqw,23px); }
    .slide[data-layout="metric-grid"] .metric-grid-cards.secondary .metric-card strong { font-size:clamp(25px,2.25cqw,44px); }
</style>
<!-- Fixed skeleton: one required lead band with one title and repeatable peer narrative paragraphs, followed by a primary metric group and a secondary metric group. LEAD_PARAGRAPHS contains only repeated p nodes. PRIMARY_METRIC_CARDS and SECONDARY_METRIC_CARDS contain only repeated metric-card nodes with h2, strong, and p in that order. Bind every source bullet once. h2 keeps the source subject, strong extracts the source's compact headline metric, and p contains only the remaining comparison/baseline wording after that extraction; p must not repeat the headline metric merely to form a sentence. Preserve every additional distinct measure in the same source bullet. A threshold such as “35%+” may be displayed as “+35%” in strong only when p retains the authored threshold meaning. Do not paraphrase, add evidence, or duplicate a signed value in both strong and p. Clone only those declared nodes; never add another band, summary, chart, or arbitrary slot. If additional peers make either group fail the geometry floor, split at a source-owned boundary instead of shrinking text. -->
<section id="{{SLIDE_ID}}" class="slide" data-layout="metric-grid" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header compact slide-section" data-pptx-shape><div><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p></div></header>
  <section class="metric-grid-body" data-geometry-fill-body><article class="metric-grid-lead" data-pptx-shape data-geometry-contain-content><h2>{{LEAD_TITLE}}</h2>{{LEAD_PARAGRAPHS}}</article><div class="metric-grid-cards primary" data-layout-repeat="primary-metric-cards" data-layout-count="{{PRIMARY_CARD_COUNT}}" data-layout-item-tag="article" data-layout-item-class="metric-card" data-layout-item-roles="metric-card-title metric-card-value metric-card-note" data-card-count="{{PRIMARY_CARD_COUNT}}">{{PRIMARY_METRIC_CARDS}}</div><div class="metric-grid-cards secondary" data-layout-repeat="secondary-metric-cards" data-layout-count="{{SECONDARY_CARD_COUNT}}" data-layout-item-tag="article" data-layout-item-class="metric-card" data-layout-item-roles="metric-card-title metric-card-value metric-card-note" data-card-count="{{SECONDARY_CARD_COUNT}}">{{SECONDARY_METRIC_CARDS}}</div></section>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
