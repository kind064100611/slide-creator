<style data-layout-style="timeline-metric-chain-conclusion">
    .slide[data-layout="timeline-metric-chain-conclusion"] .canvas { display:flex; flex-direction:column; padding:4cqh 3cqw 3.3cqh; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .slide-header { display:block; height:auto; border-bottom:0; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .title { margin:0 0 3.3cqh; font-size:clamp(34px,2.56cqw,49px); line-height:1.1; font-weight:800; letter-spacing:0; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .title::before { display:inline-block; width:.38cqw; height:3.35cqh; margin-right:1.06cqw; background:var(--accent-1); vertical-align:-.22cqh; box-shadow:.38cqw 1.33cqh 0 -.06cqw var(--negative); content:""; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .timeline { display:grid; flex:1 1 auto; min-height:0; grid-template-columns:repeat(var(--event-count),minmax(0,1fr)); align-content:center; gap:2.38cqw; margin:4.8cqh 2.88cqw 2.8cqh; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .time-step { position:relative; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .time-step::before { position:absolute; top:-3.1cqh; right:0; left:0; border-top:.22cqh solid var(--panel-line); content:""; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .time-step::after { position:absolute; top:-3.78cqh; left:0; width:.88cqw; height:1.55cqh; border-radius:50%; background:var(--accent-1); content:""; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .time-step.alert::before { border-color:var(--negative); }
    .slide[data-layout="timeline-metric-chain-conclusion"] .time-step.alert::after { background:var(--negative); }
    .slide[data-layout="timeline-metric-chain-conclusion"] .time-step time { font-size:clamp(19px,1.44cqw,28px); color:var(--accent-1); font-weight:800; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .time-step.alert time { color:var(--negative); }
    .slide[data-layout="timeline-metric-chain-conclusion"] .time-step h2 { margin:1.1cqh 0 2cqh; font-size:clamp(19px,1.44cqw,28px); line-height:1.18; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .timeline-event-metrics { display:grid; gap:1.33cqh; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .chip { display:flex; height:9.1cqh; flex-direction:column; align-items:center; justify-content:center; margin-bottom:1.33cqh; border:1px solid var(--panel-line); border-radius:.38cqw; background:var(--panel-background); color:var(--muted); font-size:clamp(12px,.94cqw,18px); line-height:1.2; text-align:center; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .chip strong { display:block; color:var(--ink); font-size:clamp(24px,1.82cqw,35px); line-height:1.1; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .chip.alert { border-color:color-mix(in srgb,var(--negative) 45%,var(--panel-line)); }
    .slide[data-layout="timeline-metric-chain-conclusion"] .chip.alert strong { color:var(--negative); }
    .slide[data-layout="timeline-metric-chain-conclusion"] .blue { color:var(--accent-1); }
    .slide[data-layout="timeline-metric-chain-conclusion"] .time-step p { margin:0; color:var(--muted); font-size:clamp(13px,1cqw,19px); line-height:1.55; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .conclusion { display:grid; min-height:15cqh; grid-template-columns:11.56cqw 1fr 22.5cqw; align-items:center; gap:1cqw; margin:0 0 4.8cqh; padding:2.25cqh 2.38cqw; border-left:.38cqw solid var(--accent-1); border-radius:.38cqw; background:var(--panel-background); }
    .slide[data-layout="timeline-metric-chain-conclusion"] .conclusion h2 { margin:0; font-size:clamp(21px,1.63cqw,31px); line-height:1.15; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .chain { position:relative; min-width:0; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .chain-nodes { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:2.2cqw; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .chain-node { padding:1.44cqh 1.25cqw; border-radius:.5cqw; background:var(--panel-2); color:var(--accent-1); font-size:clamp(13px,1cqw,19px); font-weight:750; line-height:1.2; white-space:nowrap; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .chain-node:nth-child(n+2) { background:color-mix(in srgb,var(--negative) 18%,var(--panel-2)); color:var(--negative); }
    .slide[data-layout="timeline-metric-chain-conclusion"] .chain-connectors { position:absolute; inset:0; z-index:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .chain-connector-path { fill:none; stroke:var(--muted); stroke-width:1.7px; stroke-linecap:round; vector-effect:non-scaling-stroke; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .chain-connector-arrowhead { fill:var(--muted); }
    .slide[data-layout="timeline-metric-chain-conclusion"] .conclusion p { margin:0; color:var(--muted); font-size:clamp(13px,1cqw,19px); line-height:1.55; }
    .slide[data-layout="timeline-metric-chain-conclusion"] .deck-foot { position:absolute; right:3cqw; bottom:1.1cqh; left:3cqw; min-height:0; color:var(--muted); }
</style>
<!-- Fixed skeleton: one authored timestamped timeline with repeatable same-kind event cards followed by one three-role conclusion band containing a label, causal chain, and explanatory copy. Emit event and chain nodes as direct children that satisfy their declared item contracts. Each event's timeline-event-metrics wrapper owns the authored same-kind metric chips as distinct peers; never flatten two authored chips into one paragraph. The template script owns one explicit shaft and compact arrowhead between adjacent causal nodes; never flatten the chain to one text line. -->
<section id="{{SLIDE_ID}}" class="slide" data-layout="timeline-metric-chain-conclusion" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header compact slide-section" data-pptx-shape><h1 class="title">{{TITLE}}</h1></header>
  <div class="timeline" data-layout-repeat="timeline-metric-events" data-layout-count="{{EVENT_COUNT}}" data-layout-item-tag="article" data-layout-item-class="time-step" data-layout-item-roles="timeline-time timeline-event-title timeline-event-metrics timeline-event-copy" data-layout-role-tags="timeline-time:time timeline-event-title:h2 timeline-event-metrics:div timeline-event-copy:p" data-layout-direct-roles="timeline-time timeline-event-title timeline-event-metrics timeline-event-copy" data-layout-allowed-item-classes="alert" style="--event-count:{{EVENT_COUNT}}">{{EVENTS}}</div>
  <div class="conclusion" data-pptx-shape data-geometry-contain-content><h2 class="conclusion-title">{{CONCLUSION_TITLE}}</h2><div class="chain"><svg class="chain-connectors" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg><div class="chain-nodes" data-layout-repeat="conclusion-chain-nodes" data-layout-count="{{CHAIN_COUNT}}" data-layout-item-tag="div" data-layout-item-class="chain-node" data-layout-item-roles="chain-node-label" data-layout-role-tags="chain-node-label:span" data-layout-direct-roles="chain-node-label" data-layout-role-attrs="chain-node-label:data-pptx-text">{{CHAIN_NODES}}</div></div><p class="conclusion-copy">{{CONCLUSION_BODY}}</p></div>
  <script>(()=>{const slide=document.currentScript.closest('.slide');const frame=slide.querySelector('.chain');const svg=slide.querySelector('.chain-connectors');const draw=()=>{const box=frame.getBoundingClientRect();const nodes=[...slide.querySelectorAll('.chain-nodes > .chain-node')];svg.replaceChildren();for(let i=0;i<nodes.length-1;i+=1){const a=nodes[i].getBoundingClientRect();const b=nodes[i+1].getBoundingClientRect();const sx=(a.right-box.left)/box.width*100;const ex=(b.left-box.left)/box.width*100;const y=(a.top+a.height/2-box.top)/box.height*100;const shaft=document.createElementNS('http://www.w3.org/2000/svg','path');shaft.setAttribute('class','chain-connector-path');shaft.setAttribute('d',`M ${sx} ${y} L ${ex} ${y}`);const head=document.createElementNS('http://www.w3.org/2000/svg','path');const hw=4/box.width*100;const hh=2.2/box.height*100;head.setAttribute('class','chain-connector-arrowhead');head.setAttribute('d',`M ${ex} ${y} L ${ex-hw} ${y-hh} L ${ex-hw} ${y+hh} Z`);svg.append(shaft,head)}};requestAnimationFrame(draw);window.addEventListener('resize',draw,{passive:true})})()</script>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
