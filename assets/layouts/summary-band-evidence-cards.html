<style data-layout-style="summary-band-evidence-cards">
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-header { position:relative; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-header-meta { position:absolute; right:0; top:.35cqh; color:var(--muted); font-size:clamp(10px,.72cqw,14px); font-weight:650; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-header-meta:empty { display:none; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-body { display:flex; flex:1 1 auto; min-height:0; flex-direction:column; justify-content:flex-start; gap:2.2cqh; padding:2cqh 0 1.6cqh; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-summary { display:grid; flex:0 0 auto; min-width:0; min-height:14cqh; grid-template-columns:minmax(0,1fr) 18cqw; align-items:center; gap:2cqw; padding:2.2cqh 2cqw; border:1px solid var(--panel-line); border-top:.42cqh solid var(--accent-1); border-radius:.55cqw; background:var(--panel-2); }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-summary.metric-leading { grid-template-columns:18cqw minmax(0,1fr); }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-summary.metric-leading .summary-band-evidence-metric { grid-column:1; grid-row:1; padding:0 1.5cqw 0 0; border-right:1px solid var(--line); border-left:0; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-summary.metric-leading .summary-band-evidence-summary-copy { grid-column:2; grid-row:1; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-summary-copy ul { margin:0; padding-left:1.25cqw; color:var(--muted); font-size:clamp(15px,1.15cqw,22px); line-height:1.55; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-cards { display:grid; flex:1 1 auto; min-height:35cqh; grid-template-columns:repeat(auto-fit,minmax(18cqw,1fr)); grid-auto-rows:1fr; align-content:stretch; align-items:stretch; gap:1.6cqw; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-summary-copy h2 { margin:0 0 .9cqh; color:var(--ink); font-size:clamp(21px,1.65cqw,32px); line-height:1.15; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-summary-copy p { margin:0; color:var(--muted); font-size:clamp(15px,1.15cqw,22px); line-height:1.34; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-metric { min-height:9cqh; padding-left:1.5cqw; border-left:1px solid var(--line); }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-metric span { display:block; color:var(--muted); font-size:clamp(13px,.95cqw,18px); }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-metric strong { display:inline-block; margin-top:.4cqh; color:var(--accent-2); font-size:clamp(30px,2.6cqw,50px); line-height:.92; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-metric .summary-band-evidence-summary-unit { display:inline-block; margin-left:.55cqw; color:var(--muted); font-size:clamp(13px,1cqw,19px); }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-card { display:grid; min-width:0; min-height:0; height:100%; grid-template-rows:auto auto 1fr; align-content:start; gap:1.5cqh; padding:2.4cqh 1.9cqw; border:1px solid var(--panel-line); border-top:.42cqh solid var(--accent-1); border-radius:.55cqw; background:var(--panel-background); }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-card.tone-2 { border-top-color:var(--accent-2); }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-card.tone-3 { border-top-color:var(--accent-3); }
    .slide[data-layout="summary-band-evidence-cards"] .summary-card-heading { display:flex; align-items:center; gap:.8cqw; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-card h2 { margin:0; font-size:clamp(19px,1.42cqw,27px); line-height:1.18; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-card-index { display:inline-grid; flex:0 0 3.1cqw; width:3.1cqw; height:5.3cqh; place-items:center; border-radius:.38cqw; background:var(--pill-bg); color:var(--pill-ink); font-size:clamp(17px,1.4cqw,28px); font-weight:760; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-highlight { display:grid; gap:.55cqh; padding:2.2cqh 1.35cqw; border-radius:.4cqw; background:var(--panel-2); }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-label { margin:0; color:var(--accent-1); font-size:clamp(13px,1.02cqw,20px); font-weight:740; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-value { display:block; margin:.35cqh 0 0; color:var(--accent-2); font-size:clamp(19px,1.36cqw,26px); line-height:1.08; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-caption { margin:0; color:var(--accent-1); font-size:clamp(14px,1cqw,19px); font-weight:700; line-height:1.3; }
    .slide[data-layout="summary-band-evidence-cards"] .summary-band-evidence-body-copy { margin:.3cqh 0 0; color:var(--muted); font-size:clamp(16px,1.23cqw,23px); line-height:1.5; }
</style>
<!-- Fixed skeleton: one full-width summary band followed by a repeatable group of same-kind evidence cards. Clone only summary-band-evidence-card nodes. Every card uses exactly one summary-card-heading containing a standalone materializable summary-card-index and h2, then one summary-band-evidence-highlight wrapper containing exactly one label, value, and caption, followed by one explanatory body paragraph. ORDINAL CONTRACT: when a source heading is `1 · Price trend`, `01. Price trend`, `2) Supply-chain risk`, or `03: Financial benefit`, the leading token is the index. Put only `1`/`01`/`2`/`03` in summary-card-index and only the remainder (`Price trend`, etc.) in summary-card-title. Never repeat the ordinal or its separator in the title. EMPHASIS CONTRACT: when peer prose contains an authored bold or strong conclusion, strategy, milestone, or risk phrase, bind that complete phrase verbatim to summary-band-evidence-value. Do not replace it with a calculated shorthand or an embedded number/date token. SUMMARY OWNERSHIP CONTRACT: SUMMARY_LABEL/SUMMARY_VALUE/SUMMARY_UNIT belong only to the page-level summary and must never be copied into a peer highlight. The highlight wrapper is a structural grouping, not permission to duplicate its facts in the body. Bind each source sentence or list item once: after extracting the authored highlight, the body contains only the remaining source wording. Optional tone-2 and tone-3 classes may cycle accent colors without binding layout behavior to a fixed item count. Set CARD_COUNT from the authored cards. The group may form another row when content adds peers; if geometry fails, split at a source-owned boundary instead of shrinking text. -->
<section id="{{SLIDE_ID}}" class="slide" data-layout="summary-band-evidence-cards" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header compact slide-section summary-band-evidence-header" data-pptx-shape><div><span class="eyebrow">{{EYEBROW}}</span><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p></div><span class="summary-band-evidence-header-meta">{{HEADER_META}}</span></header>
  <section class="summary-band-evidence-body" data-geometry-fill-body><article class="summary-band-evidence-summary" data-pptx-shape data-geometry-contain-content><div class="summary-band-evidence-summary-copy"><h2>{{SUMMARY_TITLE}}</h2><p>{{SUMMARY_BODY}}</p></div><div class="summary-band-evidence-metric"><span>{{SUMMARY_LABEL}}</span><strong>{{SUMMARY_VALUE}}</strong><span class="summary-band-evidence-summary-unit">{{SUMMARY_UNIT}}</span></div></article><div class="summary-band-evidence-cards" data-layout-repeat="summary-evidence-cards" data-layout-count="{{CARD_COUNT}}" data-layout-item-tag="article" data-layout-item-class="summary-band-evidence-card" data-layout-allowed-item-classes="tone-2 tone-3" data-layout-item-roles="summary-card-heading summary-card-index summary-card-title summary-band-evidence-highlight summary-band-evidence-label summary-band-evidence-value summary-band-evidence-caption summary-band-evidence-body-copy" data-card-count="{{CARD_COUNT}}">{{EVIDENCE_CARDS}}</div></section>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
