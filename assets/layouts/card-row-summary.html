<style data-layout-style="card-row-summary">
    .slide[data-layout="card-row-summary"] .card-row-summary-body { display:flex; flex:1 1 auto; min-height:0; flex-direction:column; justify-content:flex-start; gap:2.4cqh; padding:2.8cqh 0 4.2cqh; }
    .slide[data-layout="card-row-summary"] .card-row-summary-body:has(.card-row-summary-card-support) { padding-top:3cqh; }
    .slide[data-layout="card-row-summary"] .card-row-summary-row { display:grid; flex:0 0 35cqh; min-height:0; grid-template-columns:repeat(auto-fit,minmax(17cqw,1fr)); grid-auto-rows:1fr; gap:1.35cqw; align-items:stretch; }
    .slide[data-layout="card-row-summary"] .card-row-summary-card { display:flex; min-width:0; min-height:0; height:100%; flex-direction:column; gap:1.5cqh; padding:3cqh 1.6cqw; border:1px solid var(--panel-line); border-top:.42cqh solid var(--accent-1); border-radius:.55cqw; background:var(--panel-background); }
    .slide[data-layout="card-row-summary"] .card-row-summary-card:nth-child(4n+2) { border-top-color:var(--accent-2); }
    .slide[data-layout="card-row-summary"] .card-row-summary-card:nth-child(4n+3) { border-top-color:var(--accent-3); }
    .slide[data-layout="card-row-summary"] .card-row-summary-card:nth-child(4n) { border-top-color:var(--accent-1); }
    .slide[data-layout="card-row-summary"] .card-row-summary-index { display:inline-flex; flex:0 0 auto; width:3.1cqw; height:5.3cqh; align-items:center; justify-content:center; border-radius:.38cqw; background:var(--panel-2); color:var(--accent-1); font-size:clamp(18px,1.4cqw,27px); font-weight:850; line-height:1; }
    .slide[data-layout="card-row-summary"] .card-row-summary-card:has(.card-row-summary-card-support) .card-row-summary-index { font-size:clamp(34px,3.08cqw,50px); }
    .slide[data-layout="card-row-summary"] .card-row-summary-card h2 { margin:0; font-size:clamp(20px,1.75cqw,30px); line-height:1.18; }
    .slide[data-layout="card-row-summary"] .card-row-summary-card h3 { margin:0; color:var(--accent-1); font-size:clamp(13px,1.05cqw,20px); line-height:1.15; }
    .slide[data-layout="card-row-summary"] .card-row-summary-card p,.slide[data-layout="card-row-summary"] .card-row-summary-card li { color:var(--muted); font-size:clamp(15px,1.2cqw,20px); line-height:1.36; }
    .slide[data-layout="card-row-summary"] .card-row-summary-card p { margin:0; }
    .slide[data-layout="card-row-summary"] .card-row-summary-card ul,.slide[data-layout="card-row-summary"] .card-row-summary-card ol { display:grid; gap:.55cqh; margin:0; padding-left:1cqw; }
    .slide[data-layout="card-row-summary"] .card-row-summary-card-support { display:grid; min-height:7.8cqh; margin-top:auto; padding:.9cqh .8cqw; place-items:center; background:var(--panel-2); color:var(--ink); font-size:clamp(12px,.88cqw,16px); font-weight:760; line-height:1.22; text-align:center; }
    .slide[data-layout="card-row-summary"] .card-row-summary-banner { flex:0 0 auto; display:grid; min-height:10cqh; grid-template-columns:auto 1fr; align-items:center; column-gap:1.4cqw; margin-top:0; padding:1.6cqh 1.8cqw; border:1px solid var(--panel-line); border-left:.42cqw solid var(--accent-1); background:var(--panel-2); color:var(--ink); font-size:clamp(17px,1.4cqw,24px); font-weight:750; line-height:1.3; }
    .slide[data-layout="card-row-summary"] .card-row-summary-banner-label { color:var(--accent-1); font-size:clamp(13px,1cqw,19px); font-weight:800; }
    .slide[data-layout="card-row-summary"] .card-row-summary-body:has(.card-row-summary-card-support) .card-row-summary-banner { font-size:clamp(20px,1.68cqw,28px); }
    .slide[data-layout="card-row-summary"] .card-row-summary-banner b { font-size:clamp(18px,1.6cqw,26px); }
    .slide[data-layout="card-row-summary"] .card-row-summary-banner b { display:grid; min-width:4.7cqw; min-height:6cqh; margin-right:1.6cqw; place-items:center; border-radius:.35cqw; background:var(--panel-background); color:var(--accent-1); }
    .slide[data-layout="card-row-summary"] .card-row-summary-banner span b { display:inline; min-width:0; min-height:0; margin-right:0; place-items:normal; border-radius:0; background:transparent; color:var(--negative); font-size:inherit; }
    .slide[data-layout="card-row-summary"] .card-row-summary-banner span { display:block; }
    .slide[data-layout="card-row-summary"] .card-row-summary-banner small { display:block; margin-top:.55cqh; color:var(--muted); font-size:clamp(13px,1.05cqw,18px); font-weight:650; }
    .slide[data-layout="card-row-summary"] .card-row-summary-body:has(.card-row-summary-card-support) .card-row-summary-banner small { font-size:clamp(15px,1.26cqw,20px); }
    .slide[data-layout="card-row-summary"] .card-row-summary-banner p { margin:0; }
    .slide[data-layout="card-row-summary"] .card-row-summary-banner:empty { display:none; }
</style>
<!-- Use for equal source-authored peer cards followed by one full-width source-owned summary or conclusion banner. Repeat only card-row-summary-card children, set CARD_COUNT to the authored peer count, and put one explicit card-row-summary-index text node with data-pptx-shape and data-pptx-text inside every card when the source uses sequence numbers; do not synthesize indices with CSS pseudo-elements or merge them into the title. Bind the source summary heading and summary copy separately without inventing another goal label. Do not add connectors, deliverables, or an extra summary strip unless those regions exist in this fixed skeleton. Additional peers may create another card row; if the geometry floor fails, split at a source-owned boundary. -->
<section id="{{SLIDE_ID}}" class="slide" data-layout="card-row-summary" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header compact slide-section" data-pptx-shape><div><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p></div></header>
  <section class="card-row-summary-body" data-geometry-fill-body><div class="card-row-summary-row" data-layout-repeat="card-row-cards" data-layout-count="{{CARD_COUNT}}" data-layout-item-tag="article" data-layout-item-class="card-row-summary-card" data-layout-item-roles="card-row-summary-index card-row-summary-card-title card-row-summary-card-content" data-card-count="{{CARD_COUNT}}" style="--card-count:{{CARD_COUNT}}">{{CARDS}}</div><div class="card-row-summary-banner" data-pptx-shape data-geometry-contain-content><span class="card-row-summary-banner-label">{{SUMMARY_LABEL}}</span><p>{{SUMMARY_BODY}}</p></div></section>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
