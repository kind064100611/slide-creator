<style data-layout-style="list-metric-note-peer-columns">
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-lead { display:grid; flex:0 0 18cqh; grid-template-columns:9cqw 1fr; gap:2cqw; align-items:center; margin:1.8cqh 0 2.2cqh; padding:2.2cqh 2.2cqw; border:1px solid var(--panel-line); border-left:.42cqw solid var(--accent-1); border-radius:.55cqw; background:var(--panel-background); }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-lead:empty { display:none; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-lead-mark { display:grid; width:9cqw; min-height:11cqh; place-items:center; overflow:hidden; background:var(--panel-2); color:var(--accent-1); font-size:clamp(42px,4cqw,76px); font-weight:800; line-height:1; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-lead h2 { margin:0 0 1cqh; color:var(--accent-1); font-size:clamp(22px,2.1cqw,38px); line-height:1.15; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-lead p { margin:0; color:var(--muted); font-size:clamp(17px,1.4cqw,25px); line-height:1.38; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-body { display:grid; flex:1 1 auto; min-height:0; grid-template-columns:repeat(auto-fit,minmax(18cqw,1fr)); grid-auto-rows:auto; gap:1.5cqw; align-content:center; align-items:start; padding:0 0 2.2cqh; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-column { display:grid; min-width:0; min-height:0; height:auto; grid-template-rows:auto auto auto auto; align-content:start; gap:1.25cqh; padding:2.2cqh 1.5cqw; border:1px solid var(--panel-line); border-top:.44cqh solid var(--accent-1); background:var(--panel-background); }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-column:nth-child(3n+2) { border-top-color:var(--accent-2); }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-column:nth-child(3n+3) { border-top-color:var(--accent-3); }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-column h2 { margin:0; font-size:clamp(22px,2.02cqw,32px); line-height:1.14; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-column ul { display:flex; min-height:0; flex-direction:column; justify-content:flex-start; gap:1.05cqh; margin:0; padding:1.2cqh 0 0 1.15cqw; border-top:1px solid var(--line); }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-column li,.slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-caption { color:var(--muted); font-size:clamp(16px,1.26cqw,21px); line-height:1.4; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-column ul.structured-items { list-style:none; padding-left:0; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-column ul.structured-items li { display:grid; gap:.35cqh; color:var(--muted); }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-column ul.structured-items li strong { color:var(--ink); font-size:clamp(15px,1.2cqw,20px); line-height:1.2; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-column ul.structured-items li span { color:var(--muted); font-size:clamp(13px,1.02cqw,17px); line-height:1.32; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-metric { display:flex; min-height:8.5cqh; align-items:baseline; gap:.45cqw; margin-top:.4cqh; color:var(--accent-1); }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-metric strong { font-size:clamp(40px,3.65cqw,66px); font-weight:720; line-height:1; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-metric span { color:var(--muted); font-size:clamp(16px,1.26cqw,21px); line-height:1.2; }
    .slide[data-layout="list-metric-note-peer-columns"] .list-metric-note-direction { justify-self:start; margin-top:.4cqh; padding:.75cqh 1cqw; border:0; border-radius:.35cqw; background:var(--panel-2); color:var(--accent-1); font-size:clamp(14px,1.12cqw,19px); font-weight:760; line-height:1.22; text-align:left; }
</style>
<!-- Fixed skeleton: one required compact source-owned lead followed by a repeatable group of same-kind columns. Populate the fixed lead title/body; do not replace the lead with free-form paragraphs. The lead mark is template-owned neutral punctuation, not a binding: never replace it with a topic word, metric, or source label. Do not promote one peer column's metric into the lead because that duplicates and changes ownership. Each column explicitly keeps source order: h2, value plus caption, a repeatable list of evidence items, then the source-emphasized direction band. Evidence list items contain the authored evidence sentences directly. Do not invent labels such as “Evidence 1”, “Evidence 2”, “Fact”, or “Focus” when the source has no such labels; omit the strong child and use one span when an item is unlabeled. Clone only list-metric-note-column and li nodes; never demote the direction band, reorder roles, or add a page-wide conclusion. Additional peers may form another row if geometry remains valid. -->
<section id="{{SLIDE_ID}}" class="slide" data-layout="list-metric-note-peer-columns" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header compact slide-section" data-pptx-shape><div><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p></div></header>
  <article class="list-metric-note-lead slide-section" data-pptx-shape data-geometry-contain-content><div class="list-metric-note-lead-mark" data-pptx-shape data-pptx-text aria-hidden="true">!</div><div><h2>{{LEAD_TITLE}}</h2><p>{{LEAD_BODY}}</p></div></article>
  <section class="list-metric-note-body" data-layout-repeat="metric-note-columns" data-layout-count="{{COLUMN_COUNT}}" data-layout-item-tag="article" data-layout-item-class="list-metric-note-column" data-layout-item-roles="list-metric-note-title list-metric-note-metric structured-items list-metric-note-direction" data-layout-role-tags="list-metric-note-title:h2 list-metric-note-metric:div structured-items:ul list-metric-note-direction:p" data-layout-direct-roles="list-metric-note-title list-metric-note-metric structured-items list-metric-note-direction" data-column-count="{{COLUMN_COUNT}}" data-geometry-fill-body>{{COLUMNS}}</section>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
