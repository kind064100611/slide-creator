<!-- Invariant skeleton: peer signal strip -> evidence sequence + independent impact column. Repeatable fragments are .evidence-signal, .evidence-sequence-item, and .evidence-impact only. Do not add arrows or connectors between the timeline and impact peers unless the source explicitly declares one-to-one relationships. Adding other region types or changing the evidence-to-impact topology is forbidden. -->
<style data-layout-style="evidence-impact">
    .slide[data-layout="evidence-impact"] .evidence-signals { display:grid; flex:0 0 28cqh; grid-template-columns:repeat(auto-fit,minmax(13cqw,1fr)); gap:1.8cqw; padding:3cqh 0; }
    .slide[data-layout="evidence-impact"] .evidence-signal { position:relative; overflow:hidden; padding:2.4cqh 1.5cqw; border:1px solid var(--panel-line); border-radius:.72cqw; background:var(--panel-background); }
    .slide[data-layout="evidence-impact"] .evidence-signal::before { position:absolute; inset:0 auto 0 0; width:.34cqw; background:var(--negative); content:""; }
    .slide[data-layout="evidence-impact"] .evidence-signal:nth-child(3n+2)::before { background:var(--accent-2); }
    .slide[data-layout="evidence-impact"] .evidence-signal:nth-child(3n+3)::before { background:var(--accent-1); }
    .slide[data-layout="evidence-impact"] .evidence-kicker { margin:0 0 1.2cqh; color:var(--quiet); font-size:clamp(9px,.7cqw,14px); font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .slide[data-layout="evidence-impact"] .evidence-signal h2 { margin:0 0 1.6cqh; font-size:clamp(17px,1.48cqw,29px); line-height:1.05; }
    .slide[data-layout="evidence-impact"] .evidence-value { margin:0 0 1.4cqh; color:var(--negative); font-size:clamp(20px,2.05cqw,40px); font-weight:800; }
    .slide[data-layout="evidence-impact"] .evidence-signal:nth-child(3n+2) .evidence-value { color:var(--accent-2); }
    .slide[data-layout="evidence-impact"] .evidence-signal:nth-child(3n+3) .evidence-value { color:var(--accent-1); }
    .slide[data-layout="evidence-impact"] .evidence-signal p:last-child { margin:0; color:var(--muted); font-size:clamp(10px,.88cqw,17px); line-height:1.35; }
    .slide[data-layout="evidence-impact"] .evidence-body { display:grid; flex:0 0 39cqh; grid-template-columns:1.55fr 1fr; gap:3.5cqw; padding-top:3.2cqh; }
    .slide[data-layout="evidence-impact"] .evidence-sequence { display:grid; gap:.85cqh; }
    .slide[data-layout="evidence-impact"] .evidence-sequence-item { display:grid; grid-template-columns:5.8cqw 1fr; gap:1.2cqw; align-items:start; }
    .slide[data-layout="evidence-impact"] .evidence-sequence-label { color:var(--accent-2); font-size:clamp(10px,.83cqw,16px); font-weight:800; text-transform:uppercase; }
    .slide[data-layout="evidence-impact"] .evidence-sequence-item p { margin:0; padding-bottom:1.35cqh; border-bottom:1px solid var(--line); color:var(--muted); font-size:clamp(10px,.9cqw,17px); line-height:1.3; }
    .slide[data-layout="evidence-impact"] .evidence-impacts { display:grid; gap:1.5cqh; }
    .slide[data-layout="evidence-impact"] .evidence-impact { padding:1.7cqh 1.15cqw; border-left:.36cqw solid var(--negative); background:var(--panel-2); }
    .slide[data-layout="evidence-impact"] .evidence-impact strong { display:block; margin-bottom:.55cqh; font-size:clamp(11px,.95cqw,18px); }
    .slide[data-layout="evidence-impact"] .evidence-impact span { color:var(--muted); font-size:clamp(9px,.79cqw,15px); line-height:1.3; }
</style>
<section id="{{SLIDE_ID}}" class="slide" data-layout="evidence-impact" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header slide-section" data-pptx-shape><div><span class="status-chip" data-pptx-shape data-pptx-text>{{STATUS}}</span><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p></div><div class="pills">{{PILLS}}</div></header>
  <section class="evidence-signals slide-section" data-layout-repeat="evidence-signals" data-layout-count="{{SIGNAL_COUNT}}" data-layout-item-tag="article" data-layout-item-class="evidence-signal" data-layout-item-roles="evidence-kicker evidence-signal-title evidence-value evidence-signal-copy" data-signal-count="{{SIGNAL_COUNT}}" data-pptx-shape aria-label="{{SIGNALS_LABEL}}">{{SIGNAL_CARDS}}</section>
  <section class="evidence-body"><div><h2 class="section-title">{{SEQUENCE_TITLE}}</h2><div class="evidence-sequence" data-layout-repeat="evidence-sequence" data-layout-count="{{SEQUENCE_COUNT}}" data-layout-item-tag="div" data-layout-item-class="evidence-sequence-item" data-layout-item-roles="evidence-sequence-label evidence-sequence-copy" data-sequence-count="{{SEQUENCE_COUNT}}">{{SEQUENCE_ITEMS}}</div></div><div><h2 class="section-title">{{IMPACT_TITLE}}</h2><div class="evidence-impacts" data-layout-repeat="evidence-impacts" data-layout-count="{{IMPACT_COUNT}}" data-layout-item-tag="div" data-layout-item-class="evidence-impact" data-layout-item-roles="evidence-impact-title evidence-impact-copy" data-impact-count="{{IMPACT_COUNT}}">{{IMPACT_CARDS}}</div></div></section>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
