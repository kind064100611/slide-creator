<style data-layout-style="metric-assessment-strategy-side-stack">
    .slide[data-layout="metric-assessment-strategy-side-stack"] .canvas { display:flex; flex-direction:column; padding:3.78cqh 3cqw 3.3cqh; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .slide-header { display:block; height:auto; border-bottom:0; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .title { margin:0 0 3.1cqh; font-size:clamp(32px,2.38cqw,46px); line-height:1.1; font-weight:800; letter-spacing:0; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .title::before { display:inline-block; width:.44cqw; height:4.22cqh; margin-right:1.13cqw; border-radius:.13cqw; background:var(--accent-1); vertical-align:-.55cqh; content:""; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .year { position:absolute; top:5cqh; right:3cqw; padding:.67cqh .88cqw; border:1px solid var(--panel-line); border-radius:.31cqw; color:var(--muted); font-size:clamp(11px,.82cqw,16px); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .card { border:1px solid var(--panel-line); border-radius:.5cqw; background:var(--panel-background); box-shadow:0 8px 22px color-mix(in srgb,var(--accent-1) 10%,transparent); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .green { color:var(--accent-1); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .gold { color:var(--accent-2); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .talent-layout { display:grid; flex:1 1 auto; min-height:0; grid-template-columns:2fr 1.15fr; gap:1.88cqw; padding-bottom:4.5cqh; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .talent-left { display:grid; min-height:0; grid-template-rows:auto 1fr; gap:2.2cqh; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .talent-intro { display:grid; min-height:0; grid-template-columns:1fr 2fr; gap:1.75cqw; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .share { display:flex; min-height:25cqh; align-self:stretch; flex-direction:column; align-items:center; justify-content:center; padding:2.2cqh .88cqw; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .share strong { color:var(--accent-2); font-size:clamp(46px,3.7cqw,70px); line-height:1; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .share b { font-size:clamp(21px,1.56cqw,30px); line-height:1.2; text-align:center; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .share span { margin-top:1.1cqh; color:var(--muted); font-size:clamp(13px,1cqw,19px); text-align:center; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .assessment { padding:1.33cqh 0; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .assessment h2 { margin:0 0 2.45cqh; color:var(--accent-1); font-size:clamp(23px,1.75cqw,34px); line-height:1.2; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .assessment p { margin:0; color:var(--muted); font-size:clamp(16px,1.18cqw,23px); line-height:1.55; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .assess-row { display:grid; gap:1.33cqh; margin-top:2.9cqh; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .assessment-factor { display:grid; grid-template-columns:3.2cqw 1fr; align-items:center; min-height:5.2cqh; padding:.75cqh 1.25cqw; border:1px solid var(--panel-line); border-radius:.5cqw; background:var(--panel-background); box-shadow:0 4px 12px color-mix(in srgb,var(--accent-1) 8%,transparent); font-weight:700; font-size:clamp(13px,1cqw,19px); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .assessment-index { display:flex; width:2.35cqw; height:3.8cqh; align-items:center; justify-content:center; color:var(--accent-2); font-weight:800; line-height:1; text-align:center; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .strategy-block h2 { margin:0 0 2.2cqh; font-size:clamp(23px,1.75cqw,34px); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .strategy-grid { display:grid; grid-template-columns:repeat(var(--strategy-count),minmax(0,1fr)); align-items:start; gap:1.38cqw; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .strategy { min-height:24cqh; padding:2.5cqh 1.63cqw; border-top:.45cqh solid var(--accent-1); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .strategy:nth-child(3n+2) { border-top-color:var(--muted); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .strategy:nth-child(3n+3) { border-top-color:var(--accent-2); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .strategy h3 { margin:0 0 2.67cqh; font-size:clamp(19px,1.44cqw,28px); line-height:1.2; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .strategy p { margin:0; color:var(--muted); font-size:clamp(15px,1.13cqw,22px); line-height:1.65; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .talent-right { display:grid; min-height:0; grid-template-rows:repeat(var(--side-count),minmax(0,1fr)); gap:2cqh; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .side { min-height:0; padding:2.9cqh 1.63cqw; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .side h2 { margin:0 0 1.55cqh; color:var(--accent-1); font-size:clamp(19px,1.44cqw,28px); line-height:1.2; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .side strong { color:var(--accent-2); font-size:clamp(23px,1.7cqw,32px); line-height:1.08; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .side p { margin:1cqh 0 0; color:var(--muted); font-size:clamp(13px,1cqw,19px); line-height:1.45; }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .side.dark { background:var(--accent-1); color:var(--ink); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .side.dark h2 { color:var(--ink); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .side.dark strong { font-size:clamp(32px,2.45cqw,46px); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .side.dark p { color:var(--ink); }
    .slide[data-layout="metric-assessment-strategy-side-stack"] .deck-foot { position:absolute; right:3cqw; bottom:1.1cqh; left:3cqw; min-height:0; color:var(--muted); }
</style>
<!-- Fixed skeleton: a year marker, one metric/introduction card, an assessment model with repeatable factor rows, a repeatable strategy block, and a repeatable sidebar note stack. Clone the complete canonical item for every factor, strategy, and side card. Assessment ordinals are standalone centered materializable nodes, never merged into their labels. Sidebar cards are neutral by default. Apply the optional dark class only to a source-emphasized terminal target/outcome card; never apply it to the first ordinary productivity/benchmark metric merely because it has a large value. -->
<section id="{{SLIDE_ID}}" class="slide" data-layout="metric-assessment-strategy-side-stack" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header compact slide-section" data-pptx-shape><span class="year">{{YEAR}}</span><h1 class="title">{{TITLE}}</h1></header>
  <div class="talent-layout"><section class="talent-left"><div class="talent-intro"><article class="card share" data-pptx-shape data-geometry-contain-content><strong>{{SHARE_VALUE}}</strong><b>{{SHARE_TITLE}}</b><span>{{SHARE_COPY}}</span></article><article class="assessment" data-geometry-contain-content><h2>{{ASSESSMENT_TITLE}}</h2><p>{{ASSESSMENT_BODY}}</p><div class="assess-row" data-layout-repeat="assessment-factors" data-layout-count="{{ASSESSMENT_COUNT}}" data-layout-item-tag="div" data-layout-item-class="assessment-factor" data-layout-item-roles="assessment-index assessment-label" data-layout-role-tags="assessment-index:span assessment-label:span" data-layout-direct-roles="assessment-index assessment-label" data-layout-role-attrs="assessment-index:data-pptx-shape,data-pptx-text">{{ASSESSMENT_FACTORS}}</div></article></div><div class="strategy-block"><h2 class="green">{{STRATEGY_LABEL}}</h2><div class="strategy-grid" data-layout-repeat="strategy-cards" data-layout-count="{{STRATEGY_COUNT}}" data-layout-item-tag="article" data-layout-item-class="strategy" data-layout-item-roles="strategy-title strategy-copy" data-layout-role-tags="strategy-title:h3 strategy-copy:p" data-layout-direct-roles="strategy-title strategy-copy" data-layout-allowed-item-classes="card" style="--strategy-count:{{STRATEGY_COUNT}}">{{STRATEGY_CARDS}}</div></div></section><aside class="talent-right" data-layout-repeat="talent-sidebar-cards" data-layout-count="{{SIDE_COUNT}}" data-layout-item-tag="article" data-layout-item-class="side" data-layout-item-roles="side-title side-value side-copy" data-layout-role-tags="side-title:h2 side-value:strong side-copy:p" data-layout-direct-roles="side-title side-value side-copy" data-layout-allowed-item-classes="card dark" style="--side-count:{{SIDE_COUNT}}">{{SIDE_CARDS}}</aside></div>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
