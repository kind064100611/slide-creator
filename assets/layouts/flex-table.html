<style data-layout-style="flex-table">
    .slide[data-layout="flex-table"] .flex-table-body { display:flex; flex:1 1 auto; min-height:0; flex-direction:column; gap:1.8cqh; padding:1.9cqh 0; }
    .slide[data-layout="flex-table"] .flex-table-lead { flex:0 0 auto; padding:1.8cqh 1.5cqw; border-left:.42cqw solid var(--accent-1); background:var(--panel-background); }
    .slide[data-layout="flex-table"] .flex-table-lead h2 { margin:0 0 .7cqh; color:var(--ink); font-size:clamp(19px,1.6cqw,28px); line-height:1.15; }
    .slide[data-layout="flex-table"] .flex-table-lead p { margin:0; color:var(--muted); font-size:clamp(15px,1.26cqw,20px); line-height:1.3; }
    .slide[data-layout="flex-table"] .flex-table-wrap { display:flex; flex:1 1 auto; width:100%; min-height:0; align-items:stretch; overflow:hidden; border:1px solid var(--panel-line); border-radius:.55cqw; }
    .slide[data-layout="flex-table"] .flex-table { width:100%; height:100%; border-spacing:0; border-collapse:collapse; table-layout:fixed; }
    .slide[data-layout="flex-table"] .flex-table th,.slide[data-layout="flex-table"] .flex-table td { min-width:0; padding:.85cqh .82cqw; overflow-wrap:anywhere; word-break:break-word; border-right:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line); background:var(--panel-background); vertical-align:middle; }
    .slide[data-layout="flex-table"] .flex-table th:last-child,.slide[data-layout="flex-table"] .flex-table td:last-child { border-right:0; }
    .slide[data-layout="flex-table"] .flex-table tbody tr:last-child th,.slide[data-layout="flex-table"] .flex-table tbody tr:last-child td { border-bottom:0; }
    .slide[data-layout="flex-table"] .flex-table thead th { background:var(--accent-1); color:#fff; font-size:clamp(16px,1.4cqw,22px); line-height:1.18; text-align:left; }
    .slide[data-layout="flex-table"] .flex-table tbody th { color:var(--ink); font-weight:760; text-align:left; }
    .slide[data-layout="flex-table"] .flex-table tbody p { margin:0; color:var(--muted); font-size:clamp(15px,1.26cqw,20px); line-height:1.25; }
    .slide[data-layout="flex-table"] .flex-table tbody th p { color:var(--ink); font-weight:760; }
    .slide[data-layout="flex-table"] .flex-table[data-column-count="5"] th:first-child,.slide[data-layout="flex-table"] .flex-table[data-column-count="5"] td:first-child { width:15%; }
    .slide[data-layout="flex-table"] .flex-table[data-column-count="5"] th:nth-child(2),.slide[data-layout="flex-table"] .flex-table[data-column-count="5"] td:nth-child(2) { width:29%; }
    .slide[data-layout="flex-table"] .flex-table[data-column-count="5"] th:nth-child(n+3),.slide[data-layout="flex-table"] .flex-table[data-column-count="5"] td:nth-child(n+3) { text-align:center; }
    .slide[data-layout="flex-table"] .flex-table td strong { color:var(--ink); }
    .slide[data-layout="flex-table"] .flex-table .accent,.slide[data-layout="flex-table"] .blue { color:var(--accent-1); font-weight:800; }
</style>
<!-- Fixed skeleton: one required compact lead/note followed by one semantic table. TABLE_HEAD_CELLS contains two to five source-supported th elements marked data-pptx-shape. TABLE_BODY_ROWS contains two to seven tr elements; each row uses a row-header th followed by matching td cells, all marked data-pptx-shape and containing semantic p text. COLUMN_COUNT and every row's cell count must equal the exact authored table width. Keep every source column independent; never slash-merge, concatenate, or otherwise collapse adjacent columns to save width. Clone only rows/cells that preserve the declared table schema; never add cards or a second content band. -->
<section id="{{SLIDE_ID}}" class="slide" data-layout="flex-table" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header compact slide-section" data-pptx-shape><div><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p></div></header>
  <section class="flex-table-body" aria-label="{{TABLE_LABEL}}" data-geometry-fill-body><article class="flex-table-lead" data-pptx-shape data-geometry-contain-content><h2>{{LEAD_TITLE}}</h2><p>{{LEAD_BODY}}</p></article><div class="flex-table-wrap"><table class="flex-table" data-column-count="{{COLUMN_COUNT}}" aria-label="{{TABLE_LABEL}}"><thead><tr class="flex-table-head" data-layout-repeat="table-header-cells" data-layout-count="{{COLUMN_COUNT}}" data-layout-item-tag="th" data-layout-item-class="flex-table-head-cell" data-layout-item-roles="flex-table-head-copy" data-layout-role-tags="flex-table-head-copy:span" data-layout-direct-roles="flex-table-head-copy">{{TABLE_HEAD_CELLS}}</tr></thead><tbody class="flex-table-rows" data-layout-repeat="table-body-rows" data-layout-count="{{ROW_COUNT}}" data-layout-item-tag="tr" data-layout-item-class="flex-table-row" data-layout-item-roles="">{{TABLE_BODY_ROWS}}</tbody></table></div></section>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
