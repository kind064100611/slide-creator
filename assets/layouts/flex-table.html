<style data-layout-style="flex-table">
    .slide[data-layout="flex-table"] .flex-table-body { display:flex; flex:1 1 auto; min-height:0; flex-direction:column; gap:1.8cqh; padding:1.9cqh 0; }
    .slide[data-layout="flex-table"] .flex-table-lead { flex:0 0 auto; padding:1.8cqh 1.5cqw; border-left:.42cqw solid var(--accent-1); background:var(--panel-background); }
    .slide[data-layout="flex-table"] .flex-table-lead h2 { margin:0 0 .7cqh; color:var(--ink); font-size:clamp(19px,1.6cqw,28px); line-height:1.15; }
    .slide[data-layout="flex-table"] .flex-table-lead p { margin:0; color:var(--muted); font-size:clamp(15px,1.26cqw,20px); line-height:1.3; }
    .slide[data-layout="flex-table"] .flex-table-wrap { display:flex; flex:1 1 auto; width:100%; min-height:0; overflow:hidden; border:1px solid var(--panel-line); border-radius:.55cqw; }
    .slide[data-layout="flex-table"] .flex-table { display:flex; flex:1 1 auto; min-height:0; width:100%; flex-direction:column; background:var(--panel-background); }
    .slide[data-layout="flex-table"] .flex-table-head,.slide[data-layout="flex-table"] .flex-table-row { display:grid; min-width:0; }
    .slide[data-layout="flex-table"] .flex-table[data-column-count="2"] .flex-table-head,.slide[data-layout="flex-table"] .flex-table[data-column-count="2"] .flex-table-row { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .slide[data-layout="flex-table"] .flex-table[data-column-count="3"] .flex-table-head,.slide[data-layout="flex-table"] .flex-table[data-column-count="3"] .flex-table-row { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .slide[data-layout="flex-table"] .flex-table[data-column-count="4"] .flex-table-head,.slide[data-layout="flex-table"] .flex-table[data-column-count="4"] .flex-table-row { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .slide[data-layout="flex-table"] .flex-table[data-column-count="5"] .flex-table-head,.slide[data-layout="flex-table"] .flex-table[data-column-count="5"] .flex-table-row { grid-template-columns:15% 29% repeat(3,minmax(0,1fr)); }
    .slide[data-layout="flex-table"] .flex-table-rows { display:grid; flex:1 1 auto; min-height:0; grid-auto-rows:minmax(0,1fr); }
    .slide[data-layout="flex-table"] .flex-table-head-cell,.slide[data-layout="flex-table"] .flex-table-row-header,.slide[data-layout="flex-table"] .flex-table-cell { min-width:0; padding:.85cqh .82cqw; overflow-wrap:anywhere; word-break:break-word; border-right:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line); }
    .slide[data-layout="flex-table"] .flex-table-head-cell:last-child,.slide[data-layout="flex-table"] .flex-table-row-header:last-child,.slide[data-layout="flex-table"] .flex-table-cell:last-child { border-right:0; }
    .slide[data-layout="flex-table"] .flex-table-rows .flex-table-row:last-child > * { border-bottom:0; }
    .slide[data-layout="flex-table"] .flex-table-head-cell { display:flex; align-items:center; background:var(--accent-1); color:#fff; font-size:clamp(16px,1.4cqw,22px); line-height:1.18; font-weight:760; }
    .slide[data-layout="flex-table"] .flex-table-row-header { color:var(--ink); font-weight:760; }
    .slide[data-layout="flex-table"] .flex-table-cell { color:var(--muted); }
    .slide[data-layout="flex-table"] .flex-table-row-header p,.slide[data-layout="flex-table"] .flex-table-cell p { margin:0; font-size:clamp(15px,1.26cqw,20px); line-height:1.25; }
    .slide[data-layout="flex-table"] .flex-table-row-header p { color:var(--ink); }
    .slide[data-layout="flex-table"] .flex-table[data-column-count="5"] .flex-table-row > :nth-child(n+3) { text-align:center; }
    .slide[data-layout="flex-table"] .flex-table .accent,.slide[data-layout="flex-table"] .flex-table .blue { color:var(--accent-1); font-weight:800; }
</style>
<!-- Fixed skeleton: one required compact lead/note followed by one semantic grid table. TABLE_HEAD_CELLS contains two to five flex-table-head-cell div elements with data-pptx-shape, each with one direct flex-table-head-copy span with data-pptx-text. TABLE_BODY_ROWS contains two to seven flex-table-row div elements; every row starts with exactly one direct flex-table-row-header div with data-pptx-shape containing a semantic p with data-pptx-text, followed by one direct flex-table-cell div with data-pptx-shape per remaining source column, each containing a semantic p with data-pptx-text. COLUMN_COUNT and every row's direct child count must equal the exact authored table width. Keep every source column independent; never slash-merge, concatenate, or otherwise collapse adjacent columns to save width. Clone only rows/cells that preserve the declared table schema; never add cards or a second content band. -->
<section id="{{SLIDE_ID}}" class="slide" data-layout="flex-table" aria-label="{{SLIDE_LABEL}}"><article class="canvas"><span class="rail" data-pptx-shape aria-hidden="true"></span>
  <header class="slide-header compact slide-section" data-pptx-shape><div><h1>{{TITLE}}</h1><p class="subtitle">{{SUBTITLE}}</p></div></header>
  <section class="flex-table-body" aria-label="{{TABLE_LABEL}}" data-geometry-fill-body><article class="flex-table-lead" data-pptx-shape data-geometry-contain-content><h2>{{LEAD_TITLE}}</h2><p>{{LEAD_BODY}}</p></article><div class="flex-table-wrap"><div class="flex-table" data-column-count="{{COLUMN_COUNT}}" role="table" aria-label="{{TABLE_LABEL}}"><div class="flex-table-head" role="row" data-layout-repeat="table-header-cells" data-layout-count="{{COLUMN_COUNT}}" data-layout-item-tag="div" data-layout-item-class="flex-table-head-cell" data-layout-item-roles="flex-table-head-copy" data-layout-role-tags="flex-table-head-copy:span" data-layout-direct-roles="flex-table-head-copy">{{TABLE_HEAD_CELLS}}</div><div class="flex-table-rows" role="rowgroup" data-layout-repeat="table-body-rows" data-layout-count="{{ROW_COUNT}}" data-layout-item-tag="div" data-layout-item-class="flex-table-row" data-layout-item-roles="flex-table-row-header" data-layout-role-tags="flex-table-row-header:div" data-layout-direct-roles="flex-table-row-header">{{TABLE_BODY_ROWS}}</div></div></div></section>
  <footer class="deck-foot"><p>{{FOOTER_NOTE}}</p><p>{{PAGE_COUNTER}}</p></footer>
</article></section>
